<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerita Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1f1;--ink:#2b1740;--soft:#6e5a80;--rose:#d6456b;--lilac:#ebdcf2;--paper:#fffdfb;--line:#e6cfd8}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 Nunito,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}
section{padding:56px 0 8px}
h2{font-size:1.9rem;margin-bottom:6px}
.sub{color:var(--soft);margin-bottom:24px}

/* Hero */
.hero{padding:calc(64px + env(safe-area-inset-top,0px)) 0 40px;text-align:center}
.hero h1{font-size:clamp(3rem,16vw,5.2rem);font-weight:700;letter-spacing:-.02em}
.hero h1 i{color:var(--rose);font-weight:500}
.hero p{color:var(--soft);margin-top:12px}
.days{display:inline-block;margin-top:28px;padding:14px 26px;border-radius:999px;background:var(--ink);color:#fff}
.days b{font:700 1.6rem Fraunces,serif;color:#ffc2d1;margin-right:6px}

/* Timeline */
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:22px}
.item{position:relative;padding-bottom:40px}
.item::before{content:"";position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--rose);border:3px solid var(--bg)}
.item h3{font-size:1.4rem}
.item p{margin:6px 0 14px;white-space:pre-line}
.awal{background:var(--lilac);border-radius:18px;padding:22px}
.awal h3{margin-bottom:8px}.awal p{white-space:pre-line}

/* Polaroid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pol{background:var(--paper);padding:8px 8px 10px;border-radius:4px;box-shadow:0 2px 10px #2b17401f;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.pol:nth-child(odd){transform:rotate(-1.4deg)}.pol:nth-child(even){transform:rotate(1.2deg)}
.pol img,.ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--lilac)}
.ph{display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--soft);padding:8px}
.pol span{display:block;font-size:.82rem;line-height:1.35;margin-top:8px;color:var(--soft)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 16px;font:600 .9rem Nunito,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:#fff}

/* Sayang */
.sayang{background:var(--ink);color:#fff;border-radius:22px;padding:30px 24px}
.sayang h2{color:#ffc2d1}
.sayang li{list-style:none;padding:12px 0;border-top:1px solid #ffffff26;font-family:Fraunces,serif;font-size:1.15rem;line-height:1.45}
.sayang li:first-child{border-top:0}

/* Tulis */
form{display:grid;gap:10px;margin-bottom:22px}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.btn{background:var(--rose);color:#fff;border:0;border-radius:12px;padding:13px;font:600 1rem Nunito,sans-serif;cursor:pointer}
.note{background:var(--paper);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.note small{color:var(--soft)}.note p{white-space:pre-line;margin:4px 0 8px}
.note button{background:none;border:0;color:var(--rose);font:600 .85rem Nunito,sans-serif;cursor:pointer;padding:4px 0}
.hint{font-size:.85rem;color:var(--soft)}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fffdfbf2;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{color:var(--soft);text-decoration:none;font:600 .8rem Nunito,sans-serif;padding:6px 10px;border-radius:10px;text-align:center;min-width:64px}
nav a:active,nav a:focus-visible{background:var(--lilac);color:var(--ink);outline:none}

dialog{border:0;border-radius:14px;padding:10px;max-width:min(92vw,520px);background:var(--paper)}
dialog::backdrop{background:#2b1740cc}
dialog img{width:100%;max-height:70vh;object-fit:contain;display:block;border-radius:6px}
dialog p{padding:10px 4px 4px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<header class="hero wrap" id="beranda">

  <p id="tagline"></p>

  <section id="tulis">

  </section>
</main>

<nav aria-label="Menu">

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

// Beranda
$("judul").append(DATA.judul[0] + " & ", Object.assign(el("i"), { textContent: DATA.judul[1] }));
$("tagline").textContent = DATA.tagline;
$("hari").textContent = Math.max(0, Math.floor((Date.now() - new Date(DATA.mulai)) / 864e5)).toLocaleString("id-ID");

// Awal
$("awal").append(el("h3", "", DATA.awal.judul), el("p", "", DATA.awal.teks));

// Polaroid
function polaroid(f) {
  const b = el("button", "pol"); b.type = "button";
  const img = new Image(); img.src = f.file; img.alt = f.ket; img.loading = "lazy";
  img.onerror = () => { const p = el("div", "ph", "Foto belum ditambahkan"); img.replaceWith(p); b.dataset.empty = "1"; };
  b.append(img, el("span", "", f.ket));
  b.onclick = () => { if (b.dataset.empty) return; $("dImg").src = f.file; $("dImg").alt = f.ket; $("dKet").textContent = f.ket; $("dlg").showModal(); };
  return b;
}

DATA.bulan.forEach(m => {
  const it = el("div", "item"), g = el("div", "grid");
  m.foto.forEach(f => g.append(polaroid(f)));
  it.append(el("h3", "", m.nama + " 2026"), el("p", "", m.teks), g);
  $("timeline").append(it);
});

// Sayang
$("sayangJudul").textContent = DATA.sayangJudul;
DATA.sayang.forEach(s => $("sayangList").append(el("li", "", s)));

// Galeri + filter
let aktif = "Semua";
function renderGaleri() {
  $("galeri").replaceChildren();
  DATA.bulan.filter(m => aktif === "Semua" || m.nama === aktif)
    .forEach(m => m.foto.forEach(f => $("galeri").append(polaroid(f))));
}
["Semua", ...DATA.bulan.map(m => m.nama)].forEach(n => {
  const c = el("button", "chip", n); c.type = "button"; c.setAttribute("aria-pressed", n === aktif);
  c.onclick = () => { aktif = n; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); renderGaleri(); };
  $("chips").append(c);
});
renderGaleri();

// Catatan baru (disimpan di browser)
const KEY = "cerita-baru";
const muat = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const simpan = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {} };
function renderCatatan() {
  const box = $("catatan"); box.replaceChildren();
  muat().forEach((c, i) => {
    const n = el("div", "note");
    const hapus = el("button", "", "Hapus"); hapus.type = "button";
    hapus.onclick = () => { const a = muat(); a.splice(i, 1); simpan(a); renderCatatan(); };
    n.append(el("h3", "", c.judul), el("small", "", c.tgl), el("p", "", c.isi), hapus);
    box.append(n);
  });
}
$("form").onsubmit = e => {
  e.preventDefault();
  const a = muat();
  a.unshift({ judul: $("fJudul").value.trim(), isi: $("fIsi").value.trim(), tgl: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) });
  simpan(a); e.target.reset(); renderCatatan();
};
renderCatatan();
</script>
</body>
</html>
